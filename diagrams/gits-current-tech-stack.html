<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GITS-KNE · 技术栈分层</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f7fb;
      --color-ink:     #111827;
      --color-muted:   #4b5563;
      --color-accent:  #1a56db;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">技术栈 · 当前工程选型 · 2026-08-22</p>
    <h1>合同在运行时之下，不在旁边。</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gits-stack-title gits-stack-desc">
      <title id="gits-stack-title">GITS 技术栈分层</title>
      <desc id="gits-stack-desc">六层：客户经理界面、应用运行时、业务规则、知识平面、数据持久化、合同登记。应用运行时是装配焦点。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4b5563"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1a56db"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0d9488"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f7fb"/>

      <!-- Direction -->
      <text x="40" y="68" fill="#4b5563" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">体验</text>
      <line x1="56" y1="80" x2="56" y2="464" stroke="rgba(17,24,39,0.30)" stroke-width="1"/>
      <polygon points="52,80 60,80 56,72" fill="#4b5563"/>
      <text x="40" y="484" fill="#4b5563" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">合同</text>

      <line x1="100" y1="80" x2="920" y2="80" stroke="rgba(17,24,39,0.12)" stroke-width="1"/>
      <line x1="100" y1="464" x2="920" y2="464" stroke="rgba(17,24,39,0.12)" stroke-width="1"/>

      <!-- L6 客户经理界面 -->
      <rect x="100" y="80" width="820" height="64" fill="#ffffff"/>
      <line x1="100" y1="144" x2="920" y2="144" stroke="rgba(17,24,39,0.12)" stroke-width="1"/>
      <text x="120" y="116" fill="#4b5563" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L6</text>
      <text x="200" y="118" fill="#111827" font-size="16" font-weight="600" font-family="'Geist', sans-serif">客户经理界面</text>
      <text x="900" y="118" fill="#4b5563" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">Vue 3 · Naive UI · Vite · Pinia</text>

      <!-- L5 应用运行时 FOCAL -->
      <rect x="100" y="144" width="820" height="64" fill="rgba(26,86,219,0.08)"/>
      <rect x="100" y="144" width="820" height="64" fill="none" stroke="#1a56db" stroke-width="1"/>
      <text x="120" y="180" fill="#1a56db" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em" font-weight="600">L5</text>
      <text x="200" y="182" fill="#111827" font-size="16" font-weight="600" font-family="'Geist', sans-serif">应用运行时</text>
      <text x="900" y="182" fill="#1a56db" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">Java 21 · Spring Boot 3.5 · Modulith</text>

      <!-- L4 业务规则 -->
      <rect x="100" y="208" width="820" height="64" fill="#f5f7fb"/>
      <line x1="100" y1="272" x2="920" y2="272" stroke="rgba(17,24,39,0.12)" stroke-width="1"/>
      <text x="120" y="244" fill="#4b5563" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L4</text>
      <text x="200" y="246" fill="#111827" font-size="16" font-weight="600" font-family="'Geist', sans-serif">业务规则与端口</text>
      <text x="900" y="246" fill="#4b5563" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">modules/* · scenario/execute</text>

      <!-- L3 知识平面 -->
      <rect x="100" y="272" width="820" height="64" fill="#ffffff"/>
      <line x1="100" y1="336" x2="920" y2="336" stroke="rgba(17,24,39,0.12)" stroke-width="1"/>
      <text x="120" y="308" fill="#4b5563" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L3</text>
      <text x="200" y="310" fill="#111827" font-size="16" font-weight="600" font-family="'Geist', sans-serif">知识平面</text>
      <text x="900" y="310" fill="#4b5563" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">DKWS 技能调用 · 大模型适配</text>

      <!-- L2 数据持久化 -->
      <rect x="100" y="336" width="820" height="64" fill="#f8fafc"/>
      <line x1="100" y1="400" x2="920" y2="400" stroke="rgba(17,24,39,0.12)" stroke-width="1"/>
      <text x="120" y="372" fill="#4b5563" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L2</text>
      <text x="200" y="374" fill="#111827" font-size="16" font-weight="600" font-family="'Geist', sans-serif">数据持久化</text>
      <text x="900" y="374" fill="#4b5563" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">MyBatis · H2 / MySQL · Jena</text>

      <!-- L1 合同登记 -->
      <rect x="100" y="400" width="820" height="64" fill="#f8fafc"/>
      <text x="120" y="436" fill="#4b5563" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L1</text>
      <text x="200" y="438" fill="#111827" font-size="16" font-weight="600" font-family="'Geist', sans-serif">合同登记</text>
      <text x="900" y="438" fill="#4b5563" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">CONTRACT_INDEX · OpenAPI · ADR</text>

      <!-- Caption / legend strip -->
      <line x1="40" y1="520" x2="920" y2="520" stroke="rgba(17,24,39,0.10)" stroke-width="0.8"/>
      <text x="40" y="540" fill="#4b5563" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">焦点层</text>
      <text x="160" y="540" fill="#4b5563" font-size="8" font-family="'Geist', sans-serif">应用运行时只做装配：选实现、加载迁移、接安全与监控。业务规则不进这一层。</text>
      <rect x="40" y="556" width="16" height="12" rx="2" fill="rgba(26,86,219,0.08)" stroke="#1a56db" stroke-width="1"/>
      <text x="64" y="566" fill="#4b5563" font-size="8" font-family="'Geist', sans-serif">应用运行时</text>
      <rect x="220" y="556" width="16" height="12" rx="2" fill="#ffffff" stroke="rgba(17,24,39,0.12)" stroke-width="1"/>
      <text x="244" y="566" fill="#4b5563" font-size="8" font-family="'Geist', sans-serif">界面 / 知识</text>
      <rect x="440" y="556" width="16" height="12" rx="2" fill="#f8fafc" stroke="rgba(17,24,39,0.12)" stroke-width="1"/>
      <text x="464" y="566" fill="#4b5563" font-size="8" font-family="'Geist', sans-serif">持久化 / 合同</text>
    </svg>
  </div>
</body>
</html>
