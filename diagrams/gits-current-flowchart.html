<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GITS-KNE · 知识调用与受控写回流程</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f7fb;
      --color-ink:     #111827;
      --color-muted:   #4b5563;
      --color-accent:  #1a56db;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">流程图 · 知识调用与受控写回 · 2026-08-22</p>
    <h1>DKWS 没给知识，页面就空着。</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gits-flow-title gits-flow-desc">
      <title id="gits-flow-title">GITS 知识调用与受控写回流程</title>
      <desc id="gits-flow-desc">客户经理打开经营视图，GITS 只带客户号调用 DKWS。DKWS 空返回则页面空态，绝不拿本地 KYC 填色。对外副作用必须过人工门禁再写 CRM。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4b5563"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1a56db"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0d9488"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f7fb"/>

      <!-- Arrows -->
      <line x1="360" y1="80" x2="360" y2="104" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="360" y1="152" x2="360" y2="168" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="460" y1="216" x2="600" y2="216" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="360" y1="264" x2="360" y2="288" stroke="#1a56db" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="360" y1="336" x2="360" y2="352" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="460" y1="400" x2="600" y2="400" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="360" y1="448" x2="360" y2="472" stroke="#1a56db" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Arrow labels -->
      <rect x="508" y="196" width="32" height="12" rx="2" fill="#f5f7fb"/>
      <text x="524" y="205" fill="#4b5563" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">没有</text>

      <rect x="368" y="268" width="32" height="12" rx="2" fill="#f5f7fb"/>
      <text x="384" y="277" fill="#1a56db" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">有</text>

      <rect x="508" y="380" width="32" height="12" rx="2" fill="#f5f7fb"/>
      <text x="524" y="389" fill="#4b5563" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">没有</text>

      <rect x="368" y="452" width="32" height="12" rx="2" fill="#f5f7fb"/>
      <text x="384" y="461" fill="#1a56db" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">有</text>

      <!-- Start -->
      <rect x="280" y="32" width="160" height="48" rx="24" fill="rgba(17,24,39,0.03)" stroke="rgba(17,24,39,0.30)" stroke-width="1"/>
      <text x="360" y="60" fill="#111827" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">经营触发</text>

      <!-- Step -->
      <rect x="280" y="104" width="160" height="48" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1"/>
      <text x="360" y="124" fill="#111827" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">只带客户号</text>
      <text x="360" y="140" fill="#4b5563" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">调 DKWS</text>

      <!-- Diamond 1 FOCAL -->
      <polygon points="360,168 460,216 360,264 260,216" fill="rgba(26,86,219,0.08)" stroke="#1a56db" stroke-width="1"/>
      <text x="360" y="212" fill="#111827" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">DKWS 有知识?</text>
      <text x="360" y="228" fill="#4b5563" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">sections 是否为空</text>

      <!-- Empty end -->
      <rect x="600" y="192" width="200" height="48" rx="24" fill="rgba(17,24,39,0.03)" stroke="rgba(17,24,39,0.30)" stroke-width="1"/>
      <text x="700" y="212" fill="#111827" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">页面空态提示</text>
      <text x="700" y="228" fill="#4b5563" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">不拿本地 KYC 填色</text>

      <!-- Render -->
      <rect x="280" y="288" width="160" height="48" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1"/>
      <text x="360" y="308" fill="#111827" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">渲染工作台</text>
      <text x="360" y="324" fill="#4b5563" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">知识来自 DKWS</text>

      <!-- Diamond 2 -->
      <polygon points="360,352 460,400 360,448 260,400" fill="#ffffff" stroke="#111827" stroke-width="1"/>
      <text x="360" y="396" fill="#111827" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">要写 CRM?</text>
      <text x="360" y="412" fill="#4b5563" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">对外副作用</text>

      <!-- Read-only end -->
      <rect x="600" y="376" width="200" height="48" rx="24" fill="rgba(17,24,39,0.03)" stroke="rgba(17,24,39,0.30)" stroke-width="1"/>
      <text x="700" y="396" fill="#111827" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">只读结束</text>
      <text x="700" y="412" fill="#4b5563" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">无副作用</text>

      <!-- Human Gate end FOCAL -->
      <rect x="280" y="472" width="160" height="56" rx="28" fill="rgba(26,86,219,0.08)" stroke="#1a56db" stroke-width="1"/>
      <text x="360" y="496" fill="#111827" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">人工门禁</text>
      <text x="360" y="512" fill="#4b5563" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">审批后写 CRM</text>

      <!-- Legend -->
      <line x1="40" y1="548" x2="920" y2="548" stroke="rgba(17,24,39,0.10)" stroke-width="0.8"/>
      <text x="40" y="564" fill="#4b5563" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">图例 · 形状即类型</text>

      <rect x="40" y="576" width="24" height="12" rx="6" fill="rgba(17,24,39,0.03)" stroke="rgba(17,24,39,0.30)" stroke-width="1"/>
      <text x="72" y="586" fill="#4b5563" font-size="8" font-family="'Geist', sans-serif">开始 / 结束</text>

      <rect x="176" y="576" width="24" height="12" rx="2" fill="#ffffff" stroke="#111827" stroke-width="1"/>
      <text x="208" y="586" fill="#4b5563" font-size="8" font-family="'Geist', sans-serif">步骤</text>

      <polygon points="312,582 324,576 336,582 324,588" fill="rgba(26,86,219,0.08)" stroke="#1a56db" stroke-width="1"/>
      <text x="348" y="586" fill="#4b5563" font-size="8" font-family="'Geist', sans-serif">关键判断</text>

      <line x1="500" y1="582" x2="528" y2="582" stroke="#1a56db" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="536" y="586" fill="#4b5563" font-size="8" font-family="'Geist', sans-serif">主路径</text>

      <line x1="656" y1="582" x2="684" y2="582" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="692" y="586" fill="#4b5563" font-size="8" font-family="'Geist', sans-serif">分支</text>
    </svg>
  </div>
</body>
</html>
