spring:
  application:
    name: gits-kno-api
  main:
    banner-mode: "off"
  datasource:
    url: jdbc:h2:mem:gitskno;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: true
    locations: classpath:db/migration/h2
    baseline-on-migrate: true

gits:
  seed:
    enabled: true  # Enable seed data in dev/test; disabled by default in prod
  persistence:
    mode: mybatis  # jdbc | mybatis — 控制仓储实现选择
  product-knowledge:
    # KERT 侧 04_serve/interpretation 投影目录。未配置或不可达时解读 API 受控失败（503），
    # 绝不本地兜底生成产品结论。
    snapshot-dir: ""
    enabled: true

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.gien.gits.ontology,com.gien.gits.action,com.gien.gits.engagement,com.gien.gits.customerjourney
  type-handlers-package: com.gien.gits.adapter.persistence.common.typehandler
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

scenario:
  data-root: "${SCENARIO_DATA_ROOT:}"  # V1.1: 外部场景数据根目录(默认scenario/seed)。空=使用classpath(V1.0兼容)

dsh:
  # 同机 KERT。禁止把 DHCP 地址（如 192.168.31.220）写进配置。
  # 空值时 fail-closed，走 FallbackSkillExecutionAdapter（禁止本地补数）。
  base-url: "${DSH_BASE_URL:http://127.0.0.1:8107}"
  connect-timeout-ms: 5000
  read-timeout-ms: 120000
  skill-execute-path: /api/skill/execute
  health-path: /api/skill/health
  report-path-prefix: /api/skill/report
  job-path-prefix: /v1/jobs
  async-poll-interval-ms: 3000
  async-poll-timeout-ms: 180000

engagement:
  scenario:
    enabled: true
  skill:
    mode: "${ENGAGEMENT_SKILL_MODE:http}"
  llm:
    mode: mock
    base-url: "${LLM_BASE_URL:https://api.openai.com}"
    api-key: "${LLM_API_KEY:}"
    model: "${LLM_MODEL:gpt-4o-mini}"
    timeout: 30
  crm:
    mode: logging
    writeback-url: ""
    auth-token: "${CRM_AUTH_TOKEN:}"
    timeout: 30
  security:
    api-key: ""  # Empty = disabled (dev mode). Set value to enable API key auth.
    api-key-rotation: ""  # P16 G10: Rotation key — old key stays valid until deadline
    api-key-rotation-deadline: ""  # P16 G10: ISO 8601 date, e.g. 2026-09-01
    cors:
      allowed-origins: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: gits-kno-api
  tracing:
    sampling:
      probability: 1.0  # Sample 100% in dev, reduce in production
  zipkin:
    tracing:
      endpoint: "${ZIPKIN_URL:http://localhost:9411/api/v2/spans}"

server:
  shutdown: graceful
  error:
    include-stacktrace: always
    include-message: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
