name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  compile:
    name: Compile (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Compile
        run: ./mvnw --batch-mode --no-transfer-progress compile -pl apps/api -am

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run Unit Tests
        run: ./mvnw --batch-mode --no-transfer-progress test -pl apps/api -am -Dtest="**/*Test" -DfailIfNoTests=false

      - name: Coverage Gate (≥60% line coverage, unit scope)
        run: ./mvnw --batch-mode --no-transfer-progress org.jacoco:jacoco-maven-plugin:check@check-unit -pl apps/api

      - name: Upload JaCoCo Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: apps/api/target/site/jacoco/

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: compile
    # 上限 45 分钟。实测无 NVD API Key 时该 job 的 NVD 全量同步约 33 分钟
    # （4 轮均为 32m58s~33m46s）；2026-09-14 曾出现 1h54m 仍未完成、人工取消
    # （run 34836870439，非代码问题）。此上限把「无限期挂起」变为有界失败，
    # 同时不影响正常快路径（NVD 数据缓存命中 / 已配置 API Key）。
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # ── dependency-check 的 NVD 数据库（本 job 的主要耗时来源）─────────────
      # 位置：~/.m2/repository/org/owasp/dependency-check-data（约 240MB，
      # 单文件 odc.mv.db 即 ~239MB）。它虽落在上面 Maven 缓存的路径之内，
      # 但上面的主键是 hashFiles('**/pom.xml')：该主键一旦被创建，actions/cache
      # 在 HIT 时不会再保存 → 每轮下载到的 NVD 库被丢弃 → 每轮重下全部 390,807 条。
      # 实测证据：缓存 HIT 日志的 Cache Size 仅 ~70MB（不含 NVD 库），
      # 且 4 轮 Integration 均为 32m58s~33m46s。
      # 故此处为 NVD 库单独使用专用主键，并以 actions/cache/save + if: always()
      # 显式保存，确保 job 失败/取消时也留存（失败的 job 不会自动保存缓存）。
      # 主键含 run_id/run_attempt：每轮存一份最新快照，restore-keys 前缀取最近一次，
      # 使后续轮次只做增量更新而非全量 39 万条；带 run_attempt 可避免 rerun 时
      # 因同名主键已存在而导致 save 失败。
      - name: Restore dependency-check NVD data
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dc-nvd-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dc-nvd-${{ runner.os }}-

      # -Dsurefire.failIfNoSpecifiedTests=false：-am 会把 -Dtest="**/*IT" 作用到
      #   所有 reactor 模块，无 *IT 的模块（如 operational-ontology）会因
      #   "No tests matching pattern" 直接失败。这是 surefire 独立参数，
      #   -DfailIfNoTests=false 不能替代。
      # -Djacoco.skip=true：apps/api/pom.xml 的 jacoco check 绑定在 verify 且门槛 0.80，
      #   其语义是「全量测试」；本 job 只跑 *IT（-Dtest="**/*IT"），
      #   用 0.80 卡 IT-only 数据集属误报。覆盖率由单测 job（check-unit 60%）
      #   与 `make backend-test`（mvn verify 全量 80%）负责，本 job 只管集成测试。
      - name: Run Integration Tests
        env:
          # 由 Owner 在仓库 Secrets 中设置（对应授权事项 A-2）。未设置时该变量为
          # 空字符串，插件按「未提供 Key」处理，与改动前行为一致，不会硬失败。
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        # -DnvdApiKeyEnvironmentVariable：插件自身推荐的 CI 注入口径，避免 Key 进入
        # Maven debug 日志（见 GHSA-qqhq-8r2c-c3f5；该公告影响 9.0.0-9.0.5，本项目
        # 使用 12.1.0 已不受影响，但仍按推荐口径传参）。
        # 不使用 -DnvdApiKey=<明文>：那会把 Key 暴露在进程参数与日志中。
        run: ./mvnw --batch-mode --no-transfer-progress verify -pl apps/api -am -Dtest="**/*IT" -Dsurefire.failIfNoSpecifiedTests=false -Djacoco.skip=true -DnvdApiKeyEnvironmentVariable=NVD_API_KEY

      - name: Save dependency-check NVD data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dc-nvd-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

  worker-test:
    name: Worker Module Tests
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run Worker Tests
        run: ./mvnw --batch-mode --no-transfer-progress test -pl apps/worker -am

  contract-check:
    name: Contract Index Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate CONTRACT_INDEX.yaml references
        run: python3 scripts/check_contract_index_refs.py

  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Secret Scan & Permissions Check
        run: |
          python3 scripts/secret_scan.py --root .
          python3 scripts/sensitive_permissions.py --root .

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [unit-test, integration-test]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t gits-api:ci-verify .

      - name: Verify Image Created
        run: docker images gits-api:ci-verify

  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Unit Tests
        run: npm run test

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [docker-build, frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests
        run: npm run e2e

      - name: Verify E2E tests actually ran
        run: |
          REPORT="playwright-report/index.html"
          if [ ! -f "$REPORT" ]; then
            echo "WARN: No Playwright report found"
            exit 0
          fi
          # Check that at least some tests passed (not all skipped)
          PASSED=$(grep -oP '\d+ passed' "$REPORT" 2>/dev/null | grep -oP '\d+' || echo "0")
          echo "E2E tests passed: $PASSED"
          if [ "$PASSED" -eq 0 ]; then
            echo "FAIL: No E2E tests passed (all skipped?)"
            exit 1
          fi

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [compile, unit-test, integration-test, worker-test, contract-check, security-check, docker-build, frontend, e2e]
    if: always()
    steps:
      - name: Check build status
        run: |
          echo "## Build Summary"
          echo "| Job | Status |"
          echo "|-----|--------|"
          echo "| Compile | ${{ needs.compile.result }} |"
          echo "| Unit Tests | ${{ needs.unit-test.result }} |"
          echo "| Integration Tests | ${{ needs.integration-test.result }} |"
          echo "| Contract Check | ${{ needs.contract-check.result }} |"
          echo "| Security Check | ${{ needs.security-check.result }} |"
          echo "| Docker Build | ${{ needs.docker-build.result }} |"
          echo "| Frontend | ${{ needs.frontend.result }} |"
          echo "| E2E Tests | ${{ needs.e2e.result }} |"
          if [ "${{ needs.compile.result }}" = "failure" ] || \
             [ "${{ needs.unit-test.result }}" = "failure" ] || \
             [ "${{ needs.integration-test.result }}" = "failure" ] || \
             [ "${{ needs.contract-check.result }}" = "failure" ] || \
             [ "${{ needs.security-check.result }}" = "failure" ] || \
             [ "${{ needs.docker-build.result }}" = "failure" ] || \
             [ "${{ needs.frontend.result }}" = "failure" ] || \
             [ "${{ needs.e2e.result }}" = "failure" ]; then
            echo "FAIL: One or more jobs failed"
            exit 1
          fi
          echo "PASS: All jobs succeeded"
