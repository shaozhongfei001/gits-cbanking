{
  "id": "https://gientech.com/gits/kno/core",
  "name": "gits_kno_core",
  "version": "0.2.0",
  "default_prefix": "gits",
  "prefixes": {
    "gits": "https://gientech.com/gits/kno/",
    "prov": "http://www.w3.org/ns/prov#",
    "time": "http://www.w3.org/2006/time#"
  },
  "classes": {
    "OperatingCase": {
      "description": "A durable business matter spanning multiple interactions.",
      "attributes": {
        "case_id": {"identifier": true, "range": "string", "required": true},
        "case_type": {"range": "string", "required": true},
        "status": {"range": "string", "required": true},
        "purpose": {"range": "string", "required": true},
        "valid_from": {"range": "datetime", "required": true},
        "valid_to": {"range": "datetime", "required": false},
        "recorded_at": {"range": "datetime", "required": true},
        "created_by": {"range": "string", "required": true}
      }
    },
    "Customer": {
      "description": "Domain reference for a bank customer (semantic contract). Authoritative physical source is CTR-DATA-002 EDWCRM.A_ZHCX_CUST_BASE. Not an operational control-plane entity (ADR-0010).",
      "attributes": {
        "customer_id": {"identifier": true, "range": "string", "required": true, "description": "Maps from CUSTID"},
        "cust_name": {"range": "string", "required": false, "description": "Maps from CUSTNAME"},
        "cust_code": {"range": "string", "required": false, "description": "Maps from CUSTCODE"},
        "cert_no": {"range": "string", "required": false, "description": "Maps from CERTNO"},
        "cust_type": {"range": "string", "required": false, "description": "Maps from CUSTTYPE"},
        "cust_status": {"range": "string", "required": false, "description": "Maps from CUSTSTATUS"},
        "region": {"range": "string", "required": false, "description": "Maps from REGION"},
        "brid": {"range": "string", "required": false, "description": "Maps from BRID"}
      }
    },
    "Interaction": {
      "description": "A visit, call, message or other interaction event.",
      "attributes": {
        "interaction_id": {"identifier": true, "range": "string", "required": true},
        "case_id": {"range": "string", "required": true},
        "occurred_at": {"range": "datetime", "required": true},
        "channel": {"range": "string", "required": true},
        "source_hash": {"range": "string", "required": true}
      }
    },
    "Claim": {
      "description": "A typed assertion that remains separate from authoritative facts.",
      "attributes": {
        "claim_id": {"identifier": true, "range": "string", "required": true},
        "case_id": {"range": "string", "required": true},
        "claim_type": {"range": "string", "required": true},
        "claim_status": {"range": "string", "required": true},
        "statement": {"range": "string", "required": true},
        "valid_from": {"range": "datetime", "required": false},
        "valid_to": {"range": "datetime", "required": false},
        "recorded_at": {"range": "datetime", "required": true},
        "supersedes_claim_id": {"range": "string", "required": false}
      }
    },
    "Evidence": {
      "description": "A locatable source that supports, refutes or qualifies a claim.",
      "attributes": {
        "evidence_id": {"identifier": true, "range": "string", "required": true},
        "source_uri": {"range": "uri", "required": true},
        "source_version": {"range": "string", "required": true},
        "locator": {"range": "string", "required": true},
        "content_hash": {"range": "string", "required": true},
        "permission_label": {"range": "string", "required": true}
      }
    },
    "HumanConfirmation": {
      "description": "A named human disposition over a candidate claim or proposal.",
      "attributes": {
        "confirmation_id": {"identifier": true, "range": "string", "required": true},
        "subject_id": {"range": "string", "required": true},
        "decision": {"range": "string", "required": true},
        "actor_id": {"range": "string", "required": true},
        "confirmed_at": {"range": "datetime", "required": true}
      }
    },
    "Action": {
      "description": "A controlled attempt to create a formal task or write to an authoritative system.",
      "attributes": {
        "action_id": {"identifier": true, "range": "string", "required": true},
        "confirmation_id": {"range": "string", "required": true},
        "target_system": {"range": "string", "required": true},
        "target_object_id": {"range": "string", "required": true},
        "target_version": {"range": "string", "required": true},
        "idempotency_key": {"range": "string", "required": true},
        "status": {"range": "string", "required": true}
      }
    },
    "Receipt": {
      "description": "The authoritative result or failure receipt of a controlled action.",
      "attributes": {
        "receipt_id": {"identifier": true, "range": "string", "required": true},
        "action_id": {"range": "string", "required": true},
        "status": {"range": "string", "required": true},
        "target_version_after": {"range": "string", "required": false},
        "received_at": {"range": "datetime", "required": true}
      }
    },
    "Evaluation": {
      "description": "A replayable evaluation result bound to all material artifact versions.",
      "attributes": {
        "evaluation_id": {"identifier": true, "range": "string", "required": true},
        "run_manifest_id": {"range": "string", "required": true},
        "case_set_version": {"range": "string", "required": true},
        "gate_state": {"range": "string", "required": true},
        "evaluated_at": {"range": "datetime", "required": true}
      }
    },
    "KnowledgeMap": {
      "description": "知识地图（ROOT/DOMAIN/TASK）。ID 空间 KM-*；权威源 specs/knowledge-architecture/maps/。仅做身份与引用定义，不承载业务语义（GK-KE 统一地图承担者论证 V1.0 §3.3 硬约束 2）。",
      "attributes": {
        "map_id": {"identifier": true, "range": "string", "required": true, "description": "对应 knowledge-map.schema.json 的 mapId"},
        "map_type": {"range": "string", "required": true, "description": "ROOT / DOMAIN / TASK"},
        "version": {"range": "string", "required": true},
        "route_policy_ref": {"range": "string", "required": true, "description": "对应 routePolicyRef"}
      }
    },
    "TaskType": {
      "description": "任务类型。取值见 activation-contract / knowledge-map 的 entrypoints.tasks（如 PRE_VISIT_PREPARATION）。",
      "attributes": {
        "task_type_id": {"identifier": true, "range": "string", "required": true}
      }
    },
    "Asset": {
      "description": "可激活资产。ID 空间 ASSET-*；登记于 specs/knowledge-architecture/registry/AssetVersion.json。",
      "attributes": {
        "asset_id": {"identifier": true, "range": "string", "required": true},
        "asset_version": {"range": "string", "required": false}
      }
    },
    "Skill": {
      "description": "可调用技能。ID 空间 SP-*；登记于 specs/knowledge-architecture/skills/。",
      "attributes": {
        "skill_id": {"identifier": true, "range": "string", "required": true}
      }
    },
    "ActivationContract": {
      "description": "激活合同。ID 空间 AC-*；登记于 specs/knowledge-architecture/activations/。",
      "attributes": {
        "contract_id": {"identifier": true, "range": "string", "required": true}
      }
    }
  }
}
