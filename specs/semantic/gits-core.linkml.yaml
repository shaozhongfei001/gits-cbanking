{
  "id": "https://gientech.com/gits/kno/core",
  "name": "gits_kno_core",
  "version": "0.2.0",
  "default_prefix": "gits",
  "prefixes": {
    "gits": "https://gientech.com/gits/kno/",
    "prov": "http://www.w3.org/ns/prov#",
    "time": "http://www.w3.org/2006/time#"
  },
  "classes": {
    "OperatingCase": {
      "description": "A durable business matter spanning multiple interactions.",
      "attributes": {
        "case_id": {"identifier": true, "range": "string", "required": true},
        "case_type": {"range": "string", "required": true},
        "status": {"range": "string", "required": true},
        "purpose": {"range": "string", "required": true},
        "valid_from": {"range": "datetime", "required": true},
        "valid_to": {"range": "datetime", "required": false},
        "recorded_at": {"range": "datetime", "required": true},
        "created_by": {"range": "string", "required": true}
      }
    },
    "Customer": {
      "description": "Domain reference for a bank customer (semantic contract). Authoritative physical source is CTR-DATA-002 EDWCRM.A_ZHCX_CUST_BASE. Not an operational control-plane entity (ADR-0010).",
      "attributes": {
        "customer_id": {"identifier": true, "range": "string", "required": true, "description": "Maps from CUSTID"},
        "cust_name": {"range": "string", "required": false, "description": "Maps from CUSTNAME"},
        "cust_code": {"range": "string", "required": false, "description": "Maps from CUSTCODE"},
        "cert_no": {"range": "string", "required": false, "description": "Maps from CERTNO"},
        "cust_type": {"range": "string", "required": false, "description": "Maps from CUSTTYPE"},
        "cust_status": {"range": "string", "required": false, "description": "Maps from CUSTSTATUS"},
        "region": {"range": "string", "required": false, "description": "Maps from REGION"},
        "brid": {"range": "string", "required": false, "description": "Maps from BRID"}
      }
    },
    "Interaction": {
      "description": "A visit, call, message or other interaction event.",
      "attributes": {
        "interaction_id": {"identifier": true, "range": "string", "required": true},
        "case_id": {"range": "string", "required": true},
        "occurred_at": {"range": "datetime", "required": true},
        "channel": {"range": "string", "required": true},
        "source_hash": {"range": "string", "required": true}
      }
    },
    "Claim": {
      "description": "A typed assertion that remains separate from authoritative facts.",
      "attributes": {
        "claim_id": {"identifier": true, "range": "string", "required": true},
        "case_id": {"range": "string", "required": true},
        "claim_type": {"range": "string", "required": true},
        "claim_status": {"range": "string", "required": true},
        "statement": {"range": "string", "required": true},
        "valid_from": {"range": "datetime", "required": false},
        "valid_to": {"range": "datetime", "required": false},
        "recorded_at": {"range": "datetime", "required": true},
        "supersedes_claim_id": {"range": "string", "required": false}
      }
    },
    "Evidence": {
      "description": "A locatable source that supports, refutes or qualifies a claim.",
      "attributes": {
        "evidence_id": {"identifier": true, "range": "string", "required": true},
        "source_uri": {"range": "uri", "required": true},
        "source_version": {"range": "string", "required": true},
        "locator": {"range": "string", "required": true},
        "content_hash": {"range": "string", "required": true},
        "permission_label": {"range": "string", "required": true}
      }
    },
    "HumanConfirmation": {
      "description": "A named human disposition over a candidate claim or proposal.",
      "attributes": {
        "confirmation_id": {"identifier": true, "range": "string", "required": true},
        "subject_id": {"range": "string", "required": true},
        "decision": {"range": "string", "required": true},
        "actor_id": {"range": "string", "required": true},
        "confirmed_at": {"range": "datetime", "required": true}
      }
    },
    "Action": {
      "description": "A controlled attempt to create a formal task or write to an authoritative system.",
      "attributes": {
        "action_id": {"identifier": true, "range": "string", "required": true},
        "confirmation_id": {"range": "string", "required": true},
        "target_system": {"range": "string", "required": true},
        "target_object_id": {"range": "string", "required": true},
        "target_version": {"range": "string", "required": true},
        "idempotency_key": {"range": "string", "required": true},
        "status": {"range": "string", "required": true}
      }
    },
    "Receipt": {
      "description": "The authoritative result or failure receipt of a controlled action.",
      "attributes": {
        "receipt_id": {"identifier": true, "range": "string", "required": true},
        "action_id": {"range": "string", "required": true},
        "status": {"range": "string", "required": true},
        "target_version_after": {"range": "string", "required": false},
        "received_at": {"range": "datetime", "required": true}
      }
    },
    "Evaluation": {
      "description": "A replayable evaluation result bound to all material artifact versions.",
      "attributes": {
        "evaluation_id": {"identifier": true, "range": "string", "required": true},
        "run_manifest_id": {"range": "string", "required": true},
        "case_set_version": {"range": "string", "required": true},
        "gate_state": {"range": "string", "required": true},
        "evaluated_at": {"range": "datetime", "required": true}
      }
    },
    "KnowledgeMap": {
      "description": "知识地图（ROOT/DOMAIN/TASK）。ID 空间 KM-*；权威源 specs/knowledge-architecture/maps/。仅做身份与引用定义，不承载业务语义（GK-KE 统一地图承担者论证 V1.0 §3.3 硬约束 2）。",
      "attributes": {
        "map_id": {"identifier": true, "range": "string", "required": true, "description": "对应 knowledge-map.schema.json 的 mapId"},
        "map_type": {"range": "string", "required": true, "description": "ROOT / DOMAIN / TASK"},
        "version": {"range": "string", "required": true},
        "route_policy_ref": {"range": "string", "required": true, "description": "对应 routePolicyRef"}
      }
    },
    "TaskType": {
      "description": "任务类型。取值见 activation-contract / knowledge-map 的 entrypoints.tasks（如 PRE_VISIT_PREPARATION）。",
      "attributes": {
        "task_type_id": {"identifier": true, "range": "string", "required": true}
      }
    },
    "Asset": {
      "description": "可激活资产。ID 空间 ASSET-*；登记于 specs/knowledge-architecture/registry/AssetVersion.json。",
      "attributes": {
        "asset_id": {"identifier": true, "range": "string", "required": true},
        "asset_version": {"range": "string", "required": false}
      }
    },
    "Skill": {
      "description": "可调用技能。ID 空间 SP-*；登记于 specs/knowledge-architecture/skills/。",
      "attributes": {
        "skill_id": {"identifier": true, "range": "string", "required": true}
      }
    },
    "ActivationContract": {
      "description": "激活合同。ID 空间 AC-*；登记于 specs/knowledge-architecture/activations/。",
      "attributes": {
        "contract_id": {"identifier": true, "range": "string", "required": true}
      }
    },
    "CorporateGroup": {
      "description": "集团身份（建议书 V2.0 §4.3「集团」）。由 LegalEntity.groupId 与 GroupRelationship.groupId 引用；GITS 侧无独立运营类（域引用类）。",
      "attributes": {
        "group_id": {"identifier": true, "range": "string", "required": true}
      }
    },
    "LegalEntity": {
      "description": "法人/公司（建议书 V2.0 §4.3「公司」）。实据 modules/operational-ontology com.gien.gits.ontology.LegalEntity。",
      "attributes": {
        "entity_id": {"identifier": true, "range": "string", "required": true},
        "group_id": {"range": "string", "required": false, "description": "对应 LegalEntity.groupId"},
        "name": {"range": "string", "required": false},
        "role": {"range": "string", "required": false},
        "ownership": {"range": "string", "required": false},
        "bank_customer_id": {"range": "string", "required": false, "description": "对应 LegalEntity.bankCustomerId"},
        "relationship_status": {"range": "string", "required": false},
        "evidence_ref": {"range": "string", "required": false}
      }
    },
    "GroupRelationship": {
      "description": "集团内成员关系。实据 GroupRelationship（UUID id 为标识）。",
      "attributes": {
        "id": {"identifier": true, "range": "string", "required": true},
        "group_id": {"range": "string", "required": true, "description": "对应 GroupRelationship.groupId"},
        "from_entity_id": {"range": "string", "required": true, "description": "对应 GroupRelationship.fromEntityId"},
        "to_entity_id": {"range": "string", "required": true, "description": "对应 GroupRelationship.toEntityId"},
        "relationship_type": {"range": "string", "required": true},
        "ownership_ratio": {"range": "integer", "required": false}
      }
    },
    "Product": {
      "description": "产品身份（建议书 V2.0 §4.3「产品」，域引用类）。权威物理源为 KERT 产品卡 product_id（03_core/*/product-cards/PROD-*.md）；GITS 侧无产品运营类。",
      "attributes": {
        "product_id": {"identifier": true, "range": "string", "required": true}
      }
    },
    "ProductKnowledgeCard": {
      "description": "产品知识卡。实据 ProductKnowledgeCard。",
      "attributes": {
        "product_id": {"identifier": true, "range": "string", "required": true},
        "name": {"range": "string", "required": true},
        "definition": {"range": "string", "required": false},
        "trigger": {"range": "string", "required": false},
        "evidence_source": {"range": "string", "required": false}
      }
    },
    "ProductKnowledgeVersion": {
      "description": "产品知识版本。实据 ProductKnowledgeVersion（versionId 为标识）。",
      "attributes": {
        "version_id": {"identifier": true, "range": "string", "required": true},
        "product_id": {"range": "string", "required": true},
        "version_number": {"range": "integer", "required": true},
        "product_name": {"range": "string", "required": true},
        "category": {"range": "string", "required": false, "description": "产品域编码"},
        "risk_level": {"range": "string", "required": false},
        "previous_version_id": {"range": "string", "required": false}
      }
    },
    "Task": {
      "description": "任务（建议书 V2.0 §4.3「任务」）。实据 modules/human-action com.gien.gits.action.domain.Task。",
      "attributes": {
        "task_id": {"identifier": true, "range": "string", "required": true},
        "interaction_id": {"range": "string", "required": false},
        "customer_id": {"range": "string", "required": false},
        "operating_case_id": {"range": "string", "required": false},
        "task_type": {"range": "string", "required": true},
        "title": {"range": "string", "required": false},
        "status": {"range": "string", "required": true},
        "priority": {"range": "string", "required": false},
        "assigned_to": {"range": "string", "required": false},
        "parent_task_id": {"range": "string", "required": false}
      }
    },
    "Capability": {
      "description": "能力（建议书 V2.0 §4.3「能力」）。权威源 specs/knowledge-architecture/registry/Capability.json（capabilityId）。",
      "attributes": {
        "capability_id": {"identifier": true, "range": "string", "required": true},
        "version": {"range": "string", "required": false},
        "executor_ref": {"range": "string", "required": false},
        "side_effect": {"range": "string", "required": false},
        "callable": {"range": "boolean", "required": false}
      }
    },
    "Opportunity": {
      "description": "商机（系统既有对象）。实据 Opportunity。去重：ControlledAction 与 ActionReceipt 已分别由既有 Action / Receipt 承担，不重复建类。",
      "attributes": {
        "opportunity_id": {"identifier": true, "range": "string", "required": true},
        "customer_id": {"range": "string", "required": false},
        "interaction_id": {"range": "string", "required": false},
        "operating_case_id": {"range": "string", "required": false},
        "opportunity_type": {"range": "string", "required": true},
        "product_id": {"range": "string", "required": false},
        "status": {"range": "string", "required": false}
      }
    },
    "OpportunitySignal": {
      "description": "商机信号（系统既有对象）。实据 OpportunitySignal。",
      "attributes": {
        "signal_id": {"identifier": true, "range": "string", "required": true},
        "operating_case_id": {"range": "string", "required": false},
        "journey_id": {"range": "string", "required": false},
        "signal_type": {"range": "string", "required": true},
        "content": {"range": "string", "required": false},
        "source_type": {"range": "string", "required": false}
      }
    },
    "Commitment": {
      "description": "承诺（系统既有对象）。实据 Commitment。",
      "attributes": {
        "commitment_id": {"identifier": true, "range": "string", "required": true},
        "operating_case_id": {"range": "string", "required": false},
        "journey_id": {"range": "string", "required": false},
        "commitment_type": {"range": "string", "required": true},
        "content": {"range": "string", "required": false},
        "owner": {"range": "string", "required": false}
      }
    },
    "KycGapProfile": {
      "description": "KYC 缺口画像（系统既有对象）。实据 KycGapProfile。开发开放世界纪律：staleItems/partialKnownItems 不等于事实为假。",
      "attributes": {
        "profile_id": {"identifier": true, "range": "string", "required": true},
        "customer_id": {"range": "string", "required": true},
        "as_of": {"range": "date", "required": true},
        "known_items": {"range": "string", "multivalued": true, "required": false},
        "partial_known_items": {"range": "string", "multivalued": true, "required": false},
        "stale_items": {"range": "string", "multivalued": true, "required": false}
      }
    },
    "HumanGate": {
      "description": "人工门禁（系统既有对象）。实据 HumanGate。与 HumanConfirmation 区分：门禁是待裁决项，确认是裁决结果。",
      "attributes": {
        "gate_id": {"identifier": true, "range": "string", "required": true},
        "gate_type": {"range": "string", "required": true},
        "journey_id": {"range": "string", "required": false},
        "customer_id": {"range": "string", "required": false},
        "operating_case_id": {"range": "string", "required": false},
        "status": {"range": "string", "required": true}
      }
    },
    "PolicyRule": {
      "description": "策略规则（系统既有对象）。实据 PolicyRule。",
      "attributes": {
        "rule_id": {"identifier": true, "range": "string", "required": true},
        "name": {"range": "string", "required": true},
        "severity": {"range": "string", "required": false},
        "logic": {"range": "string", "required": false},
        "required_output": {"range": "string", "required": false},
        "scope": {"range": "string", "required": false}
      }
    },
    "ExternalEvent": {
      "description": "外部事件（系统既有对象）。实据 ExternalEvent。",
      "attributes": {
        "event_id": {"identifier": true, "range": "string", "required": true},
        "event_date": {"range": "date", "required": true},
        "source_type": {"range": "string", "required": false},
        "source_name": {"range": "string", "required": false},
        "entity": {"range": "string", "required": false},
        "title": {"range": "string", "required": false}
      }
    },
    "InteractionExtension": {
      "description": "互动扩展（系统既有对象）。实据 InteractionExtension。",
      "attributes": {
        "extension_id": {"identifier": true, "range": "string", "required": true},
        "interaction_id": {"range": "string", "required": true},
        "recording_consent_id": {"range": "string", "required": false},
        "commitment_ids": {"range": "string", "multivalued": true, "required": false},
        "task_ids": {"range": "string", "multivalued": true, "required": false},
        "opportunity_ids": {"range": "string", "multivalued": true, "required": false}
      }
    },
    "AuditTraceEntry": {
      "description": "审计轨迹条目（系统既有对象）。实据 AuditTraceEntry。",
      "attributes": {
        "trace_id": {"identifier": true, "range": "string", "required": true},
        "entity_type": {"range": "string", "required": true},
        "entity_id": {"range": "string", "required": true},
        "operation": {"range": "string", "required": true}
      }
    },
    "RelationshipReport": {
      "description": "关系报告（系统既有对象）。实据 RelationshipReport。",
      "attributes": {
        "report_id": {"identifier": true, "range": "string", "required": true},
        "operating_case_id": {"range": "string", "required": false},
        "journey_id": {"range": "string", "required": false},
        "report_type": {"range": "string", "required": true},
        "content": {"range": "string", "required": false},
        "based_on_evidence": {"range": "string", "multivalued": true, "required": false}
      }
    }
  }
}
