# ============================================================
# 对公产品分类基线（Corporate Product Taxonomy）
#
# contract_id: CTR-PK-TAX-001
# status: CANDIDATE / FROZEN=NO / IMPLEMENTED=NO
# loop: PI-0
# gate: G0-1
# acceptance_criteria: AT-PI0-001
#
# 权威关系：
#   - 本文件是「产品分类骨架」的权威源（Domain/Family/Category 层）。
#   - 「产品卡内容」的权威源在 Leibniz-KERT workspace
#     （examples/product-recommendation-assets/03_core/），本文件不复制其业务字段。
#   - gits-cbanking 侧仅做版本元数据镜像，非产品卡权威源。
#
# 分类来源声明（合规约束 C-2）：
#   本文件所有 id / name_zh / description 均为自建表述。
#   分类合理性已用三方公开对公分类口径做交叉验证（仅校验覆盖面完整性），
#   未抄录任何单一机构的分类命名或层级编码，交叉验证结论不进入数据字段。
#
# 已知差异（待 PI-1 处理，不在本 Gate 修正）：
#   D-1 族中文名漂移 3 处。产品卡 front matter 的 product_family_name 为
#       「结算服务 / 贸易融资 / 流动资金融资」，与 Owner 裁决 OQ-B 的族名
#       「结算 / 贸易金融 / 融资」不一致。本文件以裁决名为准，
#       产品卡侧对齐放 PI-1。
#   D-2 产品卡实测 13 张（非部分文档所述 14 张）。各族 existing_card_count
#       相加 3+2+2+2+3+1=13，与仓库实测一致。文档侧的 14 为算术错误，
#       已在 Loop 文件同步修正。
#   D-3 PROD-SET-002 国内保理归 SETTLEMENT，但其能力为 RECEIVABLE_FINANCING，
#       通用口径更接近融资类。本文件尊重产品卡现状，打 classification_review 标记，
#       不擅改产品卡。
#   D-4 产品卡 status 虚标（独立 QA 退回项 QA-2 触发）。13 张产品卡 front matter
#       均写 status: ACTIVE，但：① KERT MANIFEST §4 声明「全部资产 CANDIDATE /
#       FROZEN=NO / IMPLEMENTED=NO」；② 这些卡的字段无任何权威材料背书
#       （01_raw/_authoritative/ 为空，27 源全部 PENDING_SOURCE）；
#       ③ content_hash 多为占位假值（如 sha256:cm001hash）。
#       故产品卡侧的 ACTIVE 属虚标，权威状态以 MANIFEST 为准。
#       本文件的 taxonomy_registration_status 字段表达的是「该产品在分类基线中的
#       登记状态」，与产品卡 front matter 的 status 是不同维度，原名 card_status
#       易被误读为镜像产品卡状态，已重命名以消除歧义。
#       产品卡 status 的纠正属 PI-1 范围（须随解读管道与审核流转一并处理，
#       不得手改产品卡绕过解读链路）。
# ============================================================

