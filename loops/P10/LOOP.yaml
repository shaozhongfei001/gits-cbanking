{
  "schema_version": "2.0",
  "loop_id": "P10",
  "title": "质量加固与部署就绪",
  "status": "in_progress",
  "implementation_actor": "tech_lead",
  "objective": [
    "质量加固与部署就绪",
    "Legacy loop backfilled to protocol v2.0; original gap/acceptance detail preserved in git history at baseline_commit."
  ],
  "scope": {
    "include": [
      "loops/P10/"
    ],
    "exclude": [
      "unrelated_features",
      "production_credentials",
      "quarantined_assets"
    ]
  },
  "gates": [
    {
      "id": "contract_generate",
      "owner_kind": "implementation",
      "command": "make generate",
      "pass_condition": "All registered contracts compile without placeholders or unsupported constructs."
    },
    {
      "id": "contract_check",
      "owner_kind": "implementation",
      "command": "make check",
      "pass_condition": "Generated artifacts exactly match authoritative contract sources."
    },
    {
      "id": "security_check",
      "owner_kind": "implementation",
      "command": "make security-check",
      "pass_condition": "Secret, permissions and quarantine checks pass."
    }
  ],
  "repair_policy": {
    "max_attempts_per_gate": 5,
    "failure_record": "loops/P10/FAILURES.md",
    "record_before_fix": true,
    "rerun_original_gate": true
  },
  "exit_states": [
    "ready_for_independent_qa",
    "blocked"
  ]
}
