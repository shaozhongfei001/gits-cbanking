{
  "schema_version": "2.0",
  "loop_id": "P7-mysql-compatibility",
  "title": "MySQL 8.0 兼容性（H2→MySQL 迁移）",
  "status": "in_progress",
  "implementation_actor": "tech_lead",
  "objective": [
    "完成 H2→MySQL 8.0 兼容性收尾（V001/V002 迁移、status 保留字修复、application-mysql.yaml）",
