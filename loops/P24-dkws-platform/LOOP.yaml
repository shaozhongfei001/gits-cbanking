{
  "schema_version": "2.0",
  "loop_id": "P24-dkws-platform",
  "title": "实现 DKWS 文件目录型数据知识服务模拟平台（按 DKWS-SPEC-001 P0→P9 全量实现）",
  "status": "in_dev",
  "implementation_actor": "feature_pilot",
  "authority": {
    "spec": "scenario/文件目录型数据知识服务模拟平台_详细需求与详细设计_V1.0.md",
    "map_ref": "docs/design/knowledge-engineering-map-ref.json"
  },
  "objective": [
    "在 scenario/dkws-platform/ 下按 DKWS-SPEC-001 实现可运行的『文件目录型数据知识服务模拟平台』：五层工作区（01_raw/02_work/03_core/04_serve/90_control）+ 契约化 Markdown 文件合同 + Parquet/JSON 投影 + CLI（dkws）+ 可选 HTTP API。",
    "按规范 §20.4 实施顺序 P0→P9 推进，每个 Phase 以 §18 对应测试门禁为退出条件。",
    "纯演示/模拟平台，不生产可写、不迁移生产、不连接真实 RAG/GraphDB/向量库；复用受控合同不作 OpenAPI 变更；独立 Loop，避免跨 Loop 越界。"
  ],
  "decision": {
    "contract_scope": "reuse_only",
    "rationale": "DKWS-SPEC-001 为 scenario 演示平台的详细设计（文档自身标注 DRAFT_CANDIDATE / 已实现:NO）。本 Loop 以独立 Python 工程在 scenario/dkws-platform/ 落地其文件合同与 CLI，不改 OpenAPI/改 specs 权威源/改 CONTRACT_INDEX，因此不触发 make generate / make check 合同差异。",
    "runtime": "python>=3.11（本机 3.14.3 兼容）",
    "structure": "scenario/dkws-platform/（独立 src+cli+pytest 工程）"
  },
  "scope": {
    "include": [
      "scenario/dkws-platform/",
      "scenario/文件目录型数据知识服务模拟平台_详细需求与详细设计_V1.0.md",
      "loops/P24-dkws-platform/"
    ],
    "exclude": [
      "production_cutover",
      "real_rag_platform",
      "graphdb_connection",
      "vector_db_connection",
      "metadata_catalog_connection",
      "quarantined_assets",
      "production_credentials",
      "unrelated_java_features",
      "apps/api OpenAPI 变更"
    ]
  },
  "gates": [
    {
      "id": "p0_project_and_workspace",
      "owner_kind": "implementation",
      "command": "cd scenario/dkws-platform && PYTHONPATH=src:tests:scripts python3 -m unittest test_pipeline.TestWorkspace -v",
      "pass_condition": "TestWorkspace 通过；空工作区 init 后五层结构存在；inspect 输出 schema/meta/层清单。"
    },
    {
      "id": "p1_contract_framework",
      "owner_kind": "implementation",
      "command": "cd scenario/dkws-platform && PYTHONPATH=src:tests:scripts python3 -m unittest test_contract test_seeds -v",
      "pass_condition": "合法样例通过、非法样例被拒；frontmatter/schema/DSL 校验通过。"
    },
    {
      "id": "p2_raw_ingest",
      "owner_kind": "implementation",
      "command": "cd scenario/dkws-platform && PYTHONPATH=src:tests:scripts python3 -m unittest test_pipeline.TestIngest test_graph.TestGraphIngest -v",
      "pass_condition": "接入幂等、哈希校验、MediaType/domain 校验、图谱 CSV(BOM) 接入通过。"
    },
    {
      "id": "p3_structured_clean",
      "owner_kind": "implementation",
      "command": "cd scenario/dkws-platform && PYTHONPATH=src:tests:scripts python3 -m unittest test_pipeline.TestStateMachines test_extra_domains.TestExtraDomains -v",
      "pass_condition": "任务/资产/发布状态机合法跳转；结构化领域接入通过。"
    },
    {
      "id": "p4_docs_normalize_slice",
      "owner_kind": "implementation",
      "command": "cd scenario/dkws-platform && PYTHONPATH=src:tests:scripts python3 -m unittest test_pipeline.TestDocs -v",
      "pass_condition": "文档登记幂等、规范化与切片稳定性（同输入同段数）。"
    },
    {
      "id": "p5_knowledge_candidate",
      "owner_kind": "implementation",
      "command": "cd scenario/dkws-platform && PYTHONPATH=src:tests:scripts python3 -m unittest test_pipeline.TestKnowledge -v",
      "pass_condition": "候选生成、冲突检测、Decision 审批流转通过；系统禁自签 OWNER/QA。"
    },
    {
      "id": "p6_core_publish",
      "owner_kind": "implementation",
      "command": "cd scenario/dkws-platform && PYTHONPATH=src:tests:scripts python3 -m unittest test_pipeline.TestPublish -v",
      "pass_condition": "发布成功切换 CURRENT；无批准拒绝；缺版本报错。"
    },
    {
      "id": "p7_projections",
      "owner_kind": "implementation",
      "command": "cd scenario/dkws-platform && PYTHONPATH=src:tests:scripts python3 -m unittest test_projection.ProjectionTestCase -v",
      "pass_condition": "投影幂等重建、schema 稳定、空目录不伪装成功。"
    },
    {
      "id": "p8_services",
      "owner_kind": "implementation",
      "command": "cd scenario/dkws-platform && PYTHONPATH=src:tests:scripts python3 -m unittest test_pipeline.TestRuleExec -v && PYTHONPATH=src python3 -m dkws --help",
      "pass_condition": "规则服务测试通过；CLI --help 可用。不调用 --llm real。"
    },
    {
      "id": "p9_security_perf_e2e",
      "owner_kind": "implementation",
      "command": "cd scenario/dkws-platform && PYTHONPATH=src:tests:scripts python3 -m unittest test_e2e.EndToEndTestCase test_security_perf test_previsit_report test_pipeline.TestTraceMatrix -v",
      "pass_condition": "E2E 黄金场景、安全/性能、离线访前报告归一化通过。不调用 --llm real。"
    }
  ],
  "repair_policy": {
    "max_attempts_per_gate": 5,
    "failure_record": "loops/P24-dkws-platform/FAILURES.md",
    "record_before_fix": true,
    "rerun_original_gate": true
  },
  "exit_states": ["ready_for_independent_qa", "blocked"]
}
